name: Release Pipeline

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, aarch64-unknown-linux-gnu

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libx11-dev libxi-dev libgl1-mesa-dev wget fuse zip

      - name: Prepare Assets & Generate Data
        run: |
          mkdir -p assets
          # Download a verified MediaPipe Face Mesh ONNX model
          curl -L -o assets/face_mesh.onnx https://github.com/PINTO0309/PINTO_model_zoo/raw/main/032_FaceMesh/01_float32/model_float32.onnx
          # Download a verified test face image
          curl -L -o assets/face.jpg https://github.com/google/mediapipe/raw/master/mediapipe/examples/desktop/face_mesh/testdata/face_2d.jpg
          
          # Debug: check file sizes
          ls -lh assets/
          
          # If face_mesh.onnx is too small, something is wrong
          if [ $(stat -c%s "assets/face_mesh.onnx") -lt 1000000 ]; then
            echo "Error: face_mesh.onnx is too small. Download failed?"
            exit 1
          fi
          
          cargo run --release -p generator

      - name: Build and Package Linux (x86_64) AppImage
        run: |
          cargo build --release -p player
          mkdir -p AppDir/usr/bin/assets
          cp target/release/player AppDir/usr/bin/
          cp -r assets/* AppDir/usr/bin/assets/
          cat <<EOF > AppDir/player.desktop
          [Desktop Entry]
          Name=Avatar Player
          Exec=player
          Icon=player
          Type=Application
          Categories=Utility;
          EOF
          touch AppDir/player.svg
          wget -c -nv "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage --appimage-extract-and-run
          mv Avatar_Player-*-x86_64.AppImage avatar-player-linux-x86_64.AppImage

      - name: Build and Package Raspberry Pi (aarch64) Tarball
        run: |
          cargo install cross --git https://github.com/cross-rs/cross
          cross build --release --target aarch64-unknown-linux-gnu -p player
          mkdir -p rpi-dist/assets
          cp target/aarch64-unknown-linux-gnu/release/player rpi-dist/
          cp -r assets/* rpi-dist/assets/
          tar -czvf avatar-player-rpi-aarch64.tar.gz -C rpi-dist .

      - name: Build and Package Web (Wasm)
        run: |
          cargo build --release --target wasm32-unknown-unknown -p player
          mkdir -p web-dist/assets
          cp target/wasm32-unknown-unknown/release/player.wasm web-dist/
          cp -r assets/* web-dist/assets/
          
          # Create a polished, simple index.html for GitHub Pages
          cat <<EOF > web-dist/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <title>Faces: Audio-Driven Avatar Engine</title>
              <style>
                  body { 
                      margin: 0; 
                      background: #0f0f12; 
                      color: #e0e0e0;
                      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
                      display: flex;
                      flex-direction: column;
                      align-items: center;
                      overflow: hidden;
                      height: 100vh;
                  }
                  #container {
                      position: relative;
                      width: 100%;
                      flex-grow: 1;
                      display: flex;
                      justify-content: center;
                      align-items: center;
                  }
                  canvas { 
                      max-width: 100%; 
                      max-height: 100%; 
                      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
                      border-radius: 8px;
                  }
                  #info {
                      padding: 20px;
                      text-align: center;
                      background: rgba(20, 20, 25, 0.8);
                      width: 100%;
                      border-top: 1px solid #333;
                  }
                  h1 { margin: 0 0 10px 0; font-size: 1.5rem; color: #fff; }
                  p { margin: 5px 0; font-size: 0.9rem; opacity: 0.8; }
                  .controls { font-size: 0.8rem; color: #888; margin-top: 10px; }
              </style>
          </head>
          <body>
              <div id="container">
                  <canvas id="glcanvas"></canvas>
              </div>
              <div id="info">
                  <h1>Faces Engine</h1>
                  <p>A lightweight, 2.5D triangulated avatar engine driven by ML landmarks and phoneme synthesis.</p>
                  <div class="controls">Press <strong>H</strong> for "Hello" &bull; Press <strong>Space</strong> for Random Clip</div>
              </div>
              <script src="https://not-fl3.github.io/miniquad-samples/mq_js_bundle.js"></script>
              <script>load("player.wasm");</script>
          </body>
          </html>
          EOF
          
          zip -r avatar-player-web.zip web-dist

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: web-dist
          branch: gh-pages

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            avatar-player-linux-x86_64.AppImage
            avatar-player-rpi-aarch64.tar.gz
            avatar-player-web.zip
          draft: false
          prerelease: false
