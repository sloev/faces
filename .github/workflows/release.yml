name: Release Pipeline

on:
  push:
    branches: [ master, main ]
  release:
    types: [ created ]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, aarch64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Asset Cache
        id: cache-assets
        uses: actions/cache@v3
        with:
          path: assets/
          key: ${{ runner.os }}-assets-v1

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libx11-dev libxi-dev libgl1-mesa-dev wget fuse zip xvfb

      - name: Prepare Assets & Generate Data
        run: |
          mkdir -p assets
          if [ "${{ steps.cache-assets.outputs.cache-hit }}" != "true" ]; then
            curl -L -o assets/face_mesh.onnx "https://github.com/PINTO0309/PINTO_model_zoo/raw/main/032_FaceMesh/01_float32/model_float32.onnx"
            curl -L -o assets/face.jpg "https://upload.wikimedia.org/wikipedia/commons/8/8d/Chisato_Minami_Face.jpg"
          fi
          cargo run --release -p generator

      - name: Run Workspace Tests
        run: cargo test --workspace

      - name: Setup Multi-Platform Tools
        run: |
          mkdir -p bin
          wget -c -nv "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage" -O bin/linuxdeploy
          wget -c -nv "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage" -O bin/linuxdeploy-plugin-appimage
          wget -c -nv "https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz"
          tar -xvf cross-x86_64-unknown-linux-musl.tar.gz -C bin/
          chmod +x bin/linuxdeploy* bin/cross
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Build and Package Linux (x86_64) AppImage
        run: |
          cargo build --release -p player
          mkdir -p AppDir/usr/bin/assets
          cp target/release/player AppDir/usr/bin/
          cp -r assets/* AppDir/usr/bin/assets/
          mkdir -p AppDir/usr/share/applications
          cat <<EOF > AppDir/usr/share/applications/player.desktop
          [Desktop Entry]
          Name=Avatar Player
          Exec=player
          Icon=player
          Type=Application
          Categories=Utility;
          EOF
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
          touch AppDir/usr/share/icons/hicolor/scalable/apps/player.svg
          export APPIMAGE_EXTRACT_AND_RUN=1
          linuxdeploy --appdir AppDir --output appimage
          mv Avatar_Player-x86_64.AppImage avatar-player-linux-x86_64.AppImage

      - name: Desktop Runtime Smoke Test
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          timeout 5 xvfb-run --auto-servernum ./avatar-player-linux-x86_64.AppImage 2> crash_log.txt || true
          cat crash_log.txt
          if grep -qiE "panic|error|fatal|no such file" crash_log.txt; then
            echo "--- ❌ DESKTOP SMOKE TEST FAILED ---"
            exit 1
          fi
          echo "--- ✅ DESKTOP SMOKE TEST PASSED ---"

      - name: Build and Package Raspberry Pi (aarch64) Tarball
        run: |
          cross build --release --target aarch64-unknown-linux-gnu -p player
          mkdir -p rpi-dist/assets
          cp target/aarch64-unknown-linux-gnu/release/player rpi-dist/
          cp -r assets/* rpi-dist/assets/
          tar -czvf avatar-player-rpi-aarch64.tar.gz -C rpi-dist .

      - name: Build and Package Web (Wasm)
        run: |
          cargo build --release --target wasm32-unknown-unknown -p player
          mkdir -p web-dist/assets
          cp target/wasm32-unknown-unknown/release/player.wasm web-dist/
          # Copy the entire assets directory into web-dist
          cp -r assets/* web-dist/assets/
          
          # Debug paths
          find web-dist
          
          cat <<EOF > web-dist/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <title>Faces Engine</title>
              <style>
                  body { margin: 0; background: #0f0f12; color: #e0e0e0; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
                  #container { width: 100%; flex-grow: 1; display: flex; justify-content: center; align-items: center; }
                  canvas { max-width: 100%; max-height: 100%; border-radius: 8px; }
                  #info { padding: 20px; text-align: center; width: 100%; background: #141419; border-top: 1px solid #333; }
              </style>
          </head>
          <body>
              <div id="container"><canvas id="glcanvas"></canvas></div>
              <div id="info"><h1>Faces Engine</h1><p>Press <strong>H</strong> for Hello &bull; <strong>Space</strong> for Random</p></div>
              <script src="https://not-fl3.github.io/miniquad-samples/mq_js_bundle.js"></script>
              <script>load("player.wasm");</script>
          </body>
          </html>
          EOF
          zip -r avatar-player-web.zip web-dist

      - name: Web Runtime Smoke Test
        run: |
          npm install puppeteer node-static
          node smoke_test.js

      - name: Upload Visual Debug Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-screenshot
          path: ci_screenshot.png

      - name: Generate Version Tag
        id: version
        run: echo "tag=v0.4.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: web-dist
          branch: gh-pages

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            avatar-player-linux-x86_64.AppImage
            avatar-player-rpi-aarch64.tar.gz
            avatar-player-web.zip
          draft: false
          prerelease: false
          generate_release_notes: true
